# The library's CI. Four jobs, and the split is deliberate.
#
# index: the drift gate. It exists because the drift it catches was caused by a
# DELETION, which no Write or Edit hook can observe, so the warn family in
# hooks/ is structurally the wrong layer for that invariant.
#
# archives: the same shape for a different derived store. Each */*.skill archive
# is a committed zip of its skill directory, and nothing regenerated it on edit,
# so the two drifted silently (LESSONS_LEARNED entry 9: three archives shipped a
# scanner their own patch log said was fixed). A stale archive has no reader
# until something installs it, and then it installs the past — invisible to a
# Write/Edit hook for the same reason a deletion is, so it too is a whole-tree
# gate rather than a warn.
#
# hooks: every hook's own suite. Added because seven of the eight suites were
# running nowhere. lint-after-edit.test.mjs is the reason it matters: its stubs
# are #!/bin/sh scripts, so its six "fires" cases cannot execute on the Windows
# machine the library is maintained from, and until this job existed they were
# not executed on Linux either. Six cases that guard nothing look exactly like
# six cases that pass.
#
# hooks-windows: the mirror image of that, and it exists because the library walked
# into the same defect from the other side. THREE suites drive .ps1 scripts through
# `powershell`, the Windows-only 5.1 executable, which is absent from ubuntu-latest
# (that image ships PowerShell 7 as `pwsh`): watchdog-unattended, watchdog-network
# and relay-cli-takeover. None checked spawnSync's error, so one missing interpreter
# became fifteen logic failures in the first, a mid-run ENOENT crash in the second
# and a crash in the third. main was red for eight consecutive runs, 2026-09-17 to
# 2026-09-21, while all 22 suites passed on the maintainer's machine. All three now
# skip loudly off win32, and this job is where they actually execute.
#
# Note the count: the triage that found this first reported two, because the
# failed-log tail truncated the third. Three is what the full log says.
#
# All three run here as of 2026-09-21. relay-cli-takeover was held back for a few
# hours because its case 3 pointed the launcher at wininit.exe and relied on the
# account being unable to kill it, which on an elevated runner would have force-killed
# a system process. Worse, on the maintainer's non-admin machine that case could not
# even READ wininit, so it printed "skip" and ran nowhere at all. It now manufactures
# the condition with a taskkill stub against a victim it starts itself, so the case is
# exercised for the first time and touches nothing it did not create.
#
# All three are safe here because every side effect is suppressed or stubbed:
# -NoRemediate -NoAlert (network), -NoAlert -NoRestart (unattended), and a stub CLI
# plus a stub taskkill (takeover). No DNS flush, no adapter bounce, no Outlook COM,
# no real CLI spend, and no kill of anything the suite did not start.
#
# Cost, per price-the-spend, before it shipped: this repo is PUBLIC, so standard
# runners are free and draw on no metered allowance. FOUR jobs since 2026-09-21
# (three ubuntu, one windows), no npm install, node stdlib only, seconds each,
# billed as zero minutes. Re-price if the repo ever goes private, where per-job
# rounding bills each job a whole minute, so the four-job split would cost four
# times a single one — and the Windows job bills at 2x the Linux rate on top of
# that, making it the first thing to cut if this repo ever stops being public.
name: check-index

on:
  push:
    branches: [main]
  pull_request:

# Deliberately NOT paths-filtered. A paths filter on a required check leaves it
# permanently "Expected" and nothing merges, and this workflow's whole job is to
# notice a deleted directory, which is exactly the change a naive filter misses.
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the gate can go red
        run: node hooks/check-index.test.mjs
      - name: the index agrees with the disk
        run: node hooks/check-index.mjs

  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the archive gate can go red
        run: node hooks/check-archives.test.mjs
      - name: every .skill archive matches its skill directory
        run: node hooks/check-archives.mjs

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # push-gate.test.mjs builds throwaway git repos. It sets user.email itself,
      # but a runner with no global identity fails on the first commit, so the
      # identity is established here rather than depended upon.
      - name: git identity for the fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      # Every suite runs even after one fails, so a red run reports the whole
      # picture rather than only the first fault. A single early exit would turn
      # one platform defect into an unknown number of them.
      - name: every hook suite
        run: |
          failed=0
          for t in hooks/*.test.mjs; do
            echo "::group::$t"
            if node "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed

  # The win32 half of the hooks job. Only the PowerShell-driven suites run here:
  # everything else is already covered on Linux, and this job exists to close the gap
  # that made those unrunnable, not to duplicate the other nineteen.
  hooks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # bash rather than the runner's default PowerShell, so this loop stays identical
      # to the one in the hooks job above. Git for Windows provides it on this image.
      - name: the PowerShell-driven suites
        shell: bash
        run: |
          # Discovery is by a marker each suite DECLARES about itself, anchored to the
          # start of a comment line: exactly "// @win32-only". Both halves of that were
          # learned the hard way on 2026-09-21.
          #
          # Draft 1 grepped for spawnSync('powershell' and silently got the wrong set: it
          # matched a suite that must not run here, missed watchdog-unattended whose spawn
          # is split across two lines, and happened to return the right COUNT, so a
          # count-only guard passed while the job ran the wrong tests.
          #
          # Draft 2 grepped for a bare '@win32-only' and matched a suite that at the time
          # had to be kept OUT, because its comment EXPLAINED why it must not carry the
          # marker. Prose about a marker is not a marker. (That suite legitimately carries
          # one now, which is why the anchor rather than the example is the lesson.) Hence:
          # a declaration is at the start of its line, a mention is not. Anything discovered
          # here gets an elevated Windows runner, so precision is a safety property.
          mapfile -t suites < <(grep -lE '^// @win32-only\b' hooks/*.test.mjs)
          echo "discovered ${#suites[@]}: ${suites[*]}"
          # An empty discovery would make this job green having executed no test at all,
          # which is the exact shape of failure this workflow exists to prevent. The
          # converse — a new PowerShell suite that forgets the marker — needs no check
          # here: it has no skip either, so it fails in the ubuntu hooks job and goes red.
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "no suite carries @win32-only. Either the marker was renamed or this job is testing nothing."
            exit 1
          fi
          failed=0
          for t in "${suites[@]}"; do
            echo "::group::$t"
            if node "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
